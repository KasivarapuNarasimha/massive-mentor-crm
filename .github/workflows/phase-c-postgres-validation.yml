          MM_PHASEC_IMAGE_ID: sha256:e8538db784b854a9baac5c1be6d059dcf0db257af2d94c8c5807b5fc15f11222
        run: |
          set -euo pipefail
          set +x
          umask 077
          mkdir -p evidence
          python3 - <<'PY'
          import os,pathlib,re,subprocess
          output=pathlib.Path(os.environ['RUNNER_TEMP'],'phasec-application-private.log')
          with output.open('w') as log:
              foundation=subprocess.run(['timeout','--signal=TERM','--kill-after=15','600','bash','docs/phase-c-review/validation/run.sh','docs/phase-c-review/migration.sql.proposed'],stdout=log,stderr=subprocess.STDOUT,timeout=630)
              if foundation.returncode:
                  print('Foundation harness exit: '+str(foundation.returncode))
                  raise SystemExit(1)
              try:
                  result=subprocess.run(['timeout','--signal=TERM','--kill-after=15','600','bash','apps/api/scripts/commercial-application-run.sh'],stdout=log,stderr=subprocess.STDOUT,timeout=630)
                  code=result.returncode
              except subprocess.TimeoutExpired:
                  code=124
          lines=output.read_text(errors='replace').splitlines()
          safe=[line for line in lines if re.fullmatch(r'(?:ok|not ok) \d+ - [A-Za-z0-9 /:;,.()_=-]+',line) or re.fullmatch(r'# (?:tests|suites|pass|fail|cancelled|skipped|todo) \d+',line)]
          safe += [line for line in lines if re.fullmatch(r'# MM_(?:SETUP_FAILURE|IDENTITY_TYPES|SAFE_FIELD|OPERATION_FAILURE|CONSTRAINT):[A-Za-z0-9_:]*',line)]
          codes=sorted(set(re.findall(r'\b(?:COMMERCIAL_[A-Z_]+|OTP_[A-Z_]+|SENT_REVISION_IMMUTABLE|P[0-9]{4})\b','\n'.join(lines))))
          safe += ['Safe failure classes: '+', '.join(codes),'Harness exit: '+str(code),'Exact competing same-snapshot trigger-lock orderings: UNVERIFIED']
          pathlib.Path('evidence/application-summary.txt').write_text('\n'.join(safe)+'\n')
          print('\n'.join(safe))
          if code or not any(re.fullmatch(r'# fail 0',line) for line in lines):
              raise SystemExit(1)
          PY
      - name: Upload sanitized evidence only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: phase-c-application-evidence-${{ github.run_id }}-${{ github.run_attempt }}
