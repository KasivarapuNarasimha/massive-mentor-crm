          manifest=json.loads((out/'RELEASE.json').read_text())
          assert manifest['sourceCommit']==record['sourceCommit']==os.environ['MM_RELEASE_SOURCE_COMMIT']
          assert manifest['platform']=='linux-x64' and manifest['node']=='v22.16.0'
          checksum,name=(out/'SHA256SUMS').read_text().strip().split('  ')
          assert name=='massive-mentor-'+record['sourceCommit']+'-linux-x64.tar.gz'
          assert hashlib.sha256((out/name).read_bytes()).hexdigest()==checksum
          record['archiveSHA256']=checksum
          (out/'validation-evidence.json').write_text(json.dumps(record,indent=2)+'\n')
          summary=out/'packaging-summary.txt'
          summary.write_text(summary.read_text().replace('Real SMTP/browser validation: PENDING','Captured TLS SMTP/browser validation: PASS (run 39918705226); external real-mail delivery: UNVERIFIED'))
          print('MM_RELEASE_ARCHIVE_SHA256:'+checksum)
          PY
      - name: Upload immutable release archive and bounded evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: quotations-linux-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-evidence/
          if-no-files-found: error
          retention-days: 14
  rollback:
    needs: provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    services:
      postgres:
        image: postgres@sha256:ec9f656f17c8b4dfebf49e58cf5c46d493d4846d4ea6d8b85d0637f68ee33bfc
