      - name: Fixed Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.16.0
      - name: Frozen dependencies without lifecycle scripts
        shell: bash
        run: |
          set -euo pipefail
          set +x
          npm install --global pnpm@9.15.0 --ignore-scripts --no-audit --no-fund
          test "$(pnpm --version)" = 9.15.0
          pnpm install --frozen-lockfile --ignore-scripts
          test -z "$(git status --porcelain)"
      - name: Build exact source and install frozen tools inside disposable runner only
        shell: bash
        env:
          DATABASE_URL: postgresql://unused:unused@127.0.0.1:1/not_connected
          NEXT_PUBLIC_API_URL: http://127.0.0.1:4400/api
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          set -euo pipefail
          set +x
          umask 077
          python3 - <<'PY'
          import os,pathlib,subprocess
          commands=[['npm','ci','--prefix','scripts/quotations-browser','--ignore-scripts','--no-audit','--no-fund'],['node','scripts/quotations-browser/node_modules/playwright/cli.js','install','--with-deps','chromium'],['sudo','-n','apt-get','install','-y','libnss3-tools'],['pnpm','--filter','@massivementor/api','build'],['pnpm','--filter','@massivementor/api','lint'],['pnpm','--filter','@massivementor/api','exec','tsc','--noEmit','--incremental','false'],['pnpm','--filter','@massivementor/web','build'],['node','--test','scripts/quotations-browser/contract.test.cjs']]
          with pathlib.Path(os.environ['RUNNER_TEMP'],'browser-build.private.log').open('w') as log:
           for index,command in enumerate(commands):
            try: result=subprocess.run(command,stdout=log,stderr=subprocess.STDOUT,timeout=900)
            except subprocess.TimeoutExpired: raise SystemExit('MM_BROWSER_BUILD_FAILURE:STAGE_'+str(index+1)+':TIMEOUT')
            if result.returncode: raise SystemExit('MM_BROWSER_BUILD_FAILURE:STAGE_'+str(index+1)+':EXIT_'+str(result.returncode))
            print('MM_BROWSER_BUILD_PASS:STAGE_'+str(index+1),flush=True)
          PY
      - name: Authenticated browser E2E with isolated synthetic database and captured TLS SMTP
        shell: bash
        env:
          MM_PHASEC_DISPOSABLE: 'YES'
          MM_PHASEC_CONTAINER_ID: ${{ job.services.postgres.id }}
          MM_PHASEC_PG_PORT: ${{ job.services.postgres.ports[5432] }}
          MM_PHASEC_RUN_STARTED_AT: ${{ needs.provenance.outputs.started_at }}
          MM_PHASEC_IMAGE_DIGEST: postgres@sha256:ec9f656f17c8b4dfebf49e58cf5c46d493d4846d4ea6d8b85d0637f68ee33bfc
          MM_PHASEC_PROPOSAL_SHA256: 55b59f1cfceb621de24e407053a4eedaf2c30a4a5da1016811b4803819cc1e28
          MM_PHASEC_IMAGE_ID: sha256:e8538db784b854a9baac5c1be6d059dcf0db257af2d94c8c5807b5fc15f11222
          MM_BROWSER_SOURCE: 8f8cf944e6304727cebeee3241fc6796121a5eb9
        run: |
          set -euo pipefail
          set +x
          umask 077
          mkdir -p evidence
          python3 - <<'PY'
          import os,pathlib,re,subprocess
          output=pathlib.Path(os.environ['RUNNER_TEMP'],'browser-run.private.log')
          with output.open('w') as log:
           try:
            result=subprocess.run(['timeout','--signal=TERM','--kill-after=20','780','bash','scripts/quotations-browser/run.sh'],stdout=log,stderr=subprocess.STDOUT,timeout=810)
            code=result.returncode
           except subprocess.TimeoutExpired: code=124
          safe=[line for line in output.read_text(errors='replace').splitlines() if re.fullmatch(r'MM_BROWSER_(?:PASS|FAILURE|CLEANUP|NETWORK_CLEANUP):[A-Za-z0-9_:]+',line)]
          safe.append('Browser harness exit: '+str(code))
          pathlib.Path('evidence/browser-run-summary.txt').write_text('\n'.join(safe)+'\n')
          print('\n'.join(safe))
          if code: raise SystemExit(1)
          PY
      - name: Upload bounded synthetic browser summaries only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: quotations-browser-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/browser-*summary.*
          retention-days: 7
          if-no-files-found: warn
