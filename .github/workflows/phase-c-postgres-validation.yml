name: Quotations candidate isolated validation
'on':
  workflow_dispatch:
    inputs:
      gate:
        description: 'integration: database only; all: database then captured-mail browser E2E'
        type: choice
        required: true
        default: integration
        options:
          - integration
          - all
permissions:
  contents: read
  actions: read
concurrency:
  group: phase-c-disposable-postgres
  cancel-in-progress: false
jobs:
  provenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      started_at: ${{ steps.verify.outputs.started_at }}
    steps:
      - id: verify
        name: Verify authenticated dispatcher before provisioning PostgreSQL
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const repo = 'KasivarapuNarasimha/massive-mentor-crm';
            const path = '.github/workflows/phase-c-postgres-validation.yml';
            const e = process.env;
            if (e.GITHUB_REPOSITORY !== repo || e.GITHUB_EVENT_NAME !== 'workflow_dispatch' ||
                e.GITHUB_REF !== 'refs/heads/codex/quotations-validation' || e.GITHUB_ACTOR !== 'KasivarapuNarasimha' ||
                e.GITHUB_WORKFLOW_REF !== `${repo}/${path}@refs/heads/codex/quotations-validation` ||
                e.RUNNER_ENVIRONMENT !== 'github-hosted') {
              throw new Error('Dispatcher identity rejected');
            }
            const runId = Number(e.GITHUB_RUN_ID);
            const attempt = Number(e.GITHUB_RUN_ATTEMPT);
            if (!Number.isSafeInteger(runId) || runId < 1 ||
                !Number.isSafeInteger(attempt) || attempt < 1) {
              throw new Error('Run identity rejected');
            }
            const {data: run} = await github.rest.actions.getWorkflowRunAttempt({
              ...context.repo, run_id: runId, attempt_number: attempt
            });
            const {data: workflow} = await github.rest.actions.getWorkflow({
              ...context.repo, workflow_id: run.workflow_id
            });
            if (run.id !== runId || run.run_attempt !== attempt ||
                run.repository.full_name !== repo || run.event !== 'workflow_dispatch' ||
                run.head_branch !== 'codex/quotations-validation' || run.head_sha !== e.GITHUB_SHA ||
                run.head_sha !== e.GITHUB_WORKFLOW_SHA || workflow.path !== path ||
                run.actor.login !== 'KasivarapuNarasimha' ||
                run.triggering_actor.login !== 'KasivarapuNarasimha' ||
                run.status !== 'in_progress') {
              throw new Error('Authenticated run metadata rejected');
            }
            const started = Date.parse(run.run_started_at);
            if (!Number.isFinite(started) || started > Date.now() ||
                Date.now() - started > 3600000) {
              throw new Error('Run timestamp rejected');
            }
            core.setOutput('started_at', run.run_started_at);
  validate:
    if: inputs.gate == 'integration' || inputs.gate == 'all'
    needs: provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres@sha256:ec9f656f17c8b4dfebf49e58cf5c46d493d4846d4ea6d8b85d0637f68ee33bfc
        env:
          POSTGRES_USER: mm_phasec
          POSTGRES_PASSWORD: phasec_dummy_only
          POSTGRES_DB: postgres
        ports:
          - 5432/tcp
        options: '--health-cmd "pg_isready -U mm_phasec -d postgres" --health-interval 5s --health-timeout 5s --health-retries 12'
    steps:
      - name: Checkout fixed application checkpoint
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: KasivarapuNarasimha/massive-mentor-crm
          ref: 8f8cf944e6304727cebeee3241fc6796121a5eb9
          persist-credentials: false
          fetch-depth: 1
      - name: Verify source, hashes and environment-file exclusion
        shell: bash
        run: |
          set -euo pipefail
          set +x
          test "$(git rev-parse HEAD)" = 8f8cf944e6304727cebeee3241fc6796121a5eb9
