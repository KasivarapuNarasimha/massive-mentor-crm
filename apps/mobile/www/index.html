<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <title>Massive Mentor CRM</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f3f4f6;
        --fg: #111827;
        --muted: #6b7280;
        --card: #ffffff;
        --border: #e5e7eb;
        --primary: #2563eb;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f1419;
          --fg: #e8eaed;
          --muted: #9ca3af;
          --card: #1a1f26;
          --border: #2a313a;
          --primary: #3b82f6;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: var(--bg);
        color: var(--fg);
      }
      .wrap {
        min-height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        padding-bottom: max(1.5rem, env(safe-area-inset-bottom));
      }
      .card {
        width: min(100%, 22rem);
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 0.75rem;
        padding: 1.25rem 1.35rem;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
      }
      h1 {
        font-size: 1.05rem;
        margin: 0 0 0.35rem;
        font-weight: 650;
      }
      p {
        margin: 0 0 1rem;
        color: var(--muted);
        font-size: 0.875rem;
        line-height: 1.45;
      }
      button {
        width: 100%;
        height: 2.75rem;
        border: 0;
        border-radius: 0.5rem;
        background: var(--primary);
        color: #fff;
        font-weight: 600;
        font-size: 0.9rem;
      }
      .hint {
        margin-top: 0.75rem;
        font-size: 0.75rem;
        color: var(--muted);
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card" role="status">
        <h1>Connecting to Massive Mentor CRM…</h1>
        <p>
          If you stay on this screen, check your internet connection and try
          again.
        </p>
        <button type="button" id="retry">Retry</button>
        <div class="hint">crm.massivementor.in</div>
      </div>
    </div>
    <script>
      document.getElementById("retry").addEventListener("click", function () {
        window.location.href = "https://crm.massivementor.in/login";
      });
      // Auto-redirect when online (local www is only a fallback shell)
      if (navigator.onLine) {
        window.location.replace("https://crm.massivementor.in/login");
      }
      window.addEventListener("online", function () {
        window.location.replace("https://crm.massivementor.in/login");
      });
    </script>
  </body>
</html>
