# =============================================================================
# Massive Mentor CRM — SSE for real-time subscription sync
# MERGE ONLY into the EXISTING api.massivementor.in (or production API host)
# server { } block. Do NOT replace the whole site file (protects SSL certs).
#
# Client URL (from apps/web):
#   NEXT_PUBLIC_API_URL=https://api.massivementor.in/api
#   → stream = https://api.massivementor.in/api/billing/stream
#
# Express route:
#   app.use("/api/billing", billingRoutes)
#   GET /stream  →  /api/billing/stream
#
# INSERT this location block ABOVE the catch-all `location /` (or
# `location /api`) that proxies to Node on port 4000. nginx uses longest /
# first-match rules carefully: exact prefix locations for SSE must win.
# =============================================================================

# --- Paste inside: server { server_name api.massivementor.in; ... } ---

# Real-time subscription stream (Server-Sent Events)
# Must be ABOVE the generic API `location /` block.
location = /api/billing/stream {
    proxy_pass http://127.0.0.1:4000;
    # If you use named upstream from deploy/nginx.conf, use instead:
    # proxy_pass http://mm_api;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;

    # SSE requirements
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    proxy_request_buffering off;
    chunked_transfer_encoding off;
    gzip off;

    # Long-lived connection (heartbeats every ~20s from Node)
    proxy_connect_timeout 60s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;

    # Avoid accidental body limits on GET stream
    client_max_body_size 1m;
}

# Optional alias if any client ever omits the /api prefix (same Node app):
# location = /billing/stream {
#     proxy_pass http://127.0.0.1:4000/api/billing/stream;
#     ... same SSE directives as above ...
# }
