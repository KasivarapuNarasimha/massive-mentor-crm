# =============================================================================
# MERGE ONLY — do NOT replace your whole site file with this snippet.
# Paste these directives into your EXISTING api.massivementor.in (or default API)
# server { } block, or into the location that proxies to the Node API.
#
# Does not touch: ssl_certificate*, server_name, root, proxy_pass, upstreams.
# =============================================================================

# Inside the API server { ... } block (or http{} if you prefer global):
client_max_body_size 50M;
proxy_connect_timeout 600s;
proxy_send_timeout    600s;
proxy_read_timeout    600s;

# Optional: only on the location that proxies /api (or /) to Node:
# location / {
#     proxy_pass http://127.0.0.1:4000;
#     ...your existing proxy_set_header lines stay unchanged...
#     proxy_connect_timeout 600s;
#     proxy_send_timeout    600s;
#     proxy_read_timeout    600s;
#     client_max_body_size 50M;
# }
