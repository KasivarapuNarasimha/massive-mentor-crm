# =============================================================================
# Massive Mentor CRM — SSE for real-time Team Activity toasts
# MERGE into the EXISTING api.massivementor.in server { } block.
# Place ABOVE the catch-all `location /` (same pattern as billing stream).
# Do NOT replace the whole site file (protects SSL certs).
#
# Client: GET ${NEXT_PUBLIC_API_URL}/automations/team-activity/stream
# Express: GET /api/automations/team-activity/stream
# =============================================================================

# Real-time team activity stream (Server-Sent Events)
location = /api/automations/team-activity/stream {
    proxy_pass http://mm_api;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;

    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    proxy_request_buffering off;
    chunked_transfer_encoding off;
    gzip off;

    proxy_connect_timeout 60s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;

    client_max_body_size 1m;
}
