# Massive Mentor — production Nginx reverse proxy
# Place at /etc/nginx/sites-available/massivementor and enable.
# Requires certbot certificates for HTTPS.

upstream mm_api {
    server 127.0.0.1:4000;
    keepalive 32;
}

upstream mm_web {
    server 127.0.0.1:3000;
    keepalive 32;
}

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name app.massivementor.in admin.massivementor.in demo.massivementor.in api.massivementor.in;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# API
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.massivementor.in;

    ssl_certificate     /etc/letsencrypt/live/api.massivementor.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.massivementor.in/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    client_max_body_size 25m;

    location / {
        proxy_pass http://mm_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }

    location /health {
        proxy_pass http://mm_api/health;
        access_log off;
    }
}

# Web (customer / admin / demo share Next app; host-based portal routing in middleware)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.massivementor.in admin.massivementor.in demo.massivementor.in;

    ssl_certificate     /etc/letsencrypt/live/app.massivementor.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.massivementor.in/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    location /_next/static/ {
        proxy_pass http://mm_web;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://mm_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
