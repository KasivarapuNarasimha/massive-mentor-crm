version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: massive-mentor-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: massivementor
      POSTGRES_PASSWORD: massivementor_dev
      POSTGRES_DB: massivementor
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U massivementor"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
